{% extends 'base.html' %}

{% block content %}
<div class="max-w-lg mx-auto bg-white rounded-2xl shadow-sm p-8">
    <h1 class="text-3xl font-bold text-stone-900 mb-6">{{ title }}</h1>

    <form method="post">
        {% csrf_token %}

        {% for field in form %}
        <div class="mb-4">
            <label for="{{ field.id_for_label }}" class="block text-stone-700 font-medium mb-2">
                {{ field.label }}
            </label>
            {{ field }}
            {% if field.errors %}
            <p class="text-red-600 text-sm mt-1">{{ field.errors.0 }}</p>
            {% endif %}
        </div>
        {% endfor %}

        <button type="submit"
            class="w-full bg-amber-800 text-white py-3 rounded-full font-semibold hover:bg-amber-900 mt-6">
            Сохранить адрес
        </button>
    </form>

    <p class="text-center mt-4">
        <a href="{% url 'users:profile' %}" class="text-stone-600 hover:text-amber-800">Отмена</a>
    </p>
</div>
{% endblock %}
