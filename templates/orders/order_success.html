{% extends "base.html" %}

{% block title %}Заказ оформлен{% endblock %}

{% block content %}
<div class="bg-stone-50 min-h-screen flex items-center justify-center px-4">
    <div class="max-w-md mx-auto text-center py-16">

        <!-- Иконка галочки -->
        <div
            class="w-20 h-20 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-10 h-10" fill="none" viewBox="0 0 24 24"
                stroke="currentColor" stroke-width="2.5">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>

        <h1 class="text-3xl font-bold text-stone-900 mb-4">Спасибо за заказ!</h1>

        <p class="text-stone-600 text-lg leading-relaxed">
            Ваш заказ
            <span class="font-mono font-bold text-amber-800">#{{ order_id }}</span>
            успешно оформлен. Мы отправили подтверждение на вашу почту.
        </p>

        <a href="{% url 'catalog:product_list' %}"
            class="mt-8 inline-block bg-amber-800 text-white px-8 py-3 rounded-full hover:bg-amber-900 transition-colors font-semibold">
            Вернуться в каталог
        </a>

    </div>
</div>
{% endblock %}
