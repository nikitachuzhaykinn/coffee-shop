<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <title>{% block title %}Coffee Shop{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.3/dist/cdn.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/htmx.org@1.9.10"
        integrity="sha384-D1Kt99CQMDuVetoL1lrYwg5t+9QdHe7NLX/SoJYkXDFfX37iInKRy5xLSi8nO7UC"
        crossorigin="anonymous"></script>
    <style>
        [x-cloak] {
            display: none !important;
        }

        /* Гарантированное отключение горизонтального скролла */
        html,
        body {
            overflow-x: hidden;
            max-width: 100vw;
        }
    </style>
</head>

<body class="bg-stone-50 text-stone-900 font-sans flex flex-col min-h-screen">
    <header class="sticky top-0 z-50 bg-white shadow-sm">
        <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">
            <a href="{% url 'catalog:product_list' %}" class="text-xl font-bold text-stone-900 flex items-center gap-2">
                ☕ Coffee Shop
            </a>

            <nav class="hidden md:flex gap-6">
                <a href="{% url 'catalog:product_list' %}"
                    class="text-stone-600 hover:text-amber-800 transition-colors">Каталог</a>
                <a href="#" class="text-stone-600 hover:text-amber-800 transition-colors">О нас</a>
                <a href="#" class="text-stone-600 hover:text-amber-800 transition-colors">Доставка</a>
            </nav>

            <div class="flex items-center gap-4">
                <button class="text-stone-600 hover:text-amber-800">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                        stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </button>
                <a href="{% url 'cart:cart_detail' %}"
                    class="relative text-stone-600 hover:text-amber-800 transition-colors">
                    <span class="text-2xl">🛒</span>
                    {% include "cart/_cart_count.html" %}
                </a>
                <a href="#"
                    class="bg-amber-800 text-white px-4 py-2 rounded-full hover:bg-amber-900 transition-colors text-sm font-medium">
                    Войти
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-8 flex-grow w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-stone-900 text-stone-300 py-8 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p>&copy; 2026 Coffee Shop. Все права защищены.</p>
        </div>
    </footer>

    <!-- УВЕДОМЛЕНИЕ -->
    <div id="cart-notification"
        class="fixed bottom-6 right-6 bg-emerald-600 text-white px-6 py-3 rounded-lg shadow-lg z-50 flex items-center gap-2 font-medium"
        style="display: none; opacity: 0; transform: translateY(16px); transition: all 0.3s ease-out;">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
        </svg>
        Товар добавлен в корзину
    </div>

    <script>
        function showCartNotification() {
            const notif = document.getElementById('cart-notification');
            if (!notif) return;
            notif.style.display = 'flex';
            setTimeout(() => {
                notif.style.opacity = '1';
                notif.style.transform = 'translateY(0)';
            }, 10);
            setTimeout(() => {
                notif.style.opacity = '0';
                notif.style.transform = 'translateY(16px)';
                setTimeout(() => { notif.style.display = 'none'; }, 300);
            }, 2500);
        }
    </script>

    <script>
        // Обновление счетчика корзины при получении события
        document.addEventListener('cart-added', function () {
            // HTMX сам обновит элемент с id="cart-count"
        });

        // Глобальная функция для принудительного обновления счетчика
        function updateCartCount(count) {
            const cartCountEl = document.getElementById('cart-count');
            if (cartCountEl) {
                cartCountEl.textContent = count;
            }
        }
    </script>
</body>

</html>
