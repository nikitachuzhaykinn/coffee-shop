<div id="cart-item-{{ item.key }}"
    class="bg-white rounded-lg shadow-sm p-4 flex flex-col sm:flex-row gap-4 items-start sm:items-center">

    {% if item.product.image %}
    <img src="{{ item.product.image.url }}" alt="{{ item.product.name }}"
        class="w-20 h-20 object-cover rounded-lg bg-stone-200 flex-shrink-0">
    {% else %}
    <div
        class="w-20 h-20 flex items-center justify-center rounded-lg bg-stone-200 flex-shrink-0 text-stone-400 text-3xl">
        ☕</div>
    {% endif %}

    <div class="flex-grow min-w-0">
        <h3 class="text-lg font-semibold text-stone-900 truncate">{{ item.product.name }}</h3>
        {% if item.modifiers %}
        <p class="text-sm text-stone-500 mt-1">
            {% for mod in item.modifiers %}
            {{ mod.name }}{% if not forloop.last %}, {% endif %}
            {% endfor %}
        </p>
        {% endif %}
        <p class="font-mono text-amber-800 mt-1 sm:hidden whitespace-nowrap">{{ item.unit_price }} ₽</p>
    </div>

    <!-- Счетчик: обновляет весь контейнер корзины -->
    <form hx-post="{% url 'cart:cart_update' item.key %}" hx-target="#cart-main-container" hx-swap="outerHTML"
        class="flex items-center border border-stone-300 rounded-lg flex-shrink-0">
        {% csrf_token %}
        <button type="submit" name="quantity" value="{{ item.quantity|add:'-1' }}"
            class="px-3 py-2 hover:bg-stone-100 text-stone-600 transition-colors rounded-l-lg">-</button>
        <span class="w-12 text-center border-x border-stone-300 py-2 bg-white text-stone-900">{{ item.quantity }}</span>
        <button type="submit" name="quantity" value="{{ item.quantity|add:'1' }}"
            class="px-3 py-2 hover:bg-stone-100 text-stone-600 transition-colors rounded-r-lg">+</button>
    </form>

    <!-- Удаление: тоже обновляет весь контейнер -->
    <form hx-post="{% url 'cart:cart_remove' item.key %}" hx-target="#cart-main-container" hx-swap="outerHTML"
        class="flex-shrink-0">
        {% csrf_token %}
        <button type="submit" class="text-red-600 hover:text-red-800 transition-colors p-2 rounded-lg hover:bg-red-50"
            title="Удалить">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                <path fill-rule="evenodd"
                    d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z"
                    clip-rule="evenodd" />
            </svg>
        </button>
    </form>
</div>
