<div id="cart-main-container" class="w-full overflow-hidden">
    {% if cart.get_total_items == 0 %}
    <div class="bg-white rounded-2xl shadow-sm p-12 text-center w-full">
        <div class="text-6xl mb-4">☕</div>
        <p class="text-stone-500 text-center py-4 text-lg">Корзина пуста</p>
        <a href="{% url 'catalog:product_list' %}"
            class="inline-block bg-amber-800 text-white px-6 py-3 rounded-full hover:bg-amber-900 transition-colors mt-4">
            Перейти в каталог
        </a>
    </div>
    {% else %}
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 w-full">
        <div id="cart-items-container" class="lg:col-span-2 space-y-4">
            {% for item in cart %}
            {% include "cart/_cart_item.html" with item=item cart=cart %}
            {% endfor %}
        </div>

        <div class="lg:col-span-1">
            <div id="cart-totals" class="bg-white rounded-2xl shadow-sm p-6 sticky top-24">
                <h2 class="text-xl font-bold text-stone-900 mb-4">Ваш заказ</h2>

                <div class="mb-6">
                    <p class="text-stone-600 mb-2">Итого к оплате:</p>
                    <p class="text-4xl font-mono font-bold text-amber-800">{{ cart.get_total_price }} ₽</p>
                </div>

                <a href="#"
                    class="block w-full text-center bg-amber-800 text-white px-8 py-3 rounded-full text-lg font-semibold hover:bg-amber-900 transition-colors shadow-md">
                    Оформить заказ
                </a>
            </div>
        </div>
    </div>
    {% endif %}
</div>
